<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>数字 0 Watcher</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<main class="app">
  <h1>数字 0 Watcher</h1>
  <p class="sub">1〜4桁の数字表示を1つの枠でOCRし、値が0になったら通知します。現在は精度優先モードです。</p>

  <section class="panel">
    <div id="stage" class="stage">
      <video id="video" autoplay playsinline muted></video>
      <div id="roi" class="roi" style="left:42%;top:52%;width:30%;height:21%">
        <span>1〜4桁の数字</span>
        <i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i>
      </div>
    </div>
    <p class="note">数字部分全体を1つの枠で囲んでください。最大4桁分の幅で囲んでおけば、実際の表示が1桁・2桁・3桁でもそのまま認識します。</p>
    <div class="buttons">
      <button id="start" class="primary">カメラ開始</button>
      <button id="stop" disabled>停止</button>
      <button id="notify">通知を許可</button>
    </div>
  </section>

  <section class="panel result">
    <div><small>認識値</small><strong id="value">---</strong></div>
    <div><small>状態</small><b id="status">停止中</b></div>
  </section>

  <section class="panel settings">
    <h2>調整</h2>
    <label>表示タイプ
      <select id="polarity"><option value="auto" selected>自動</option><option value="dark">暗い数字 / 明るい背景</option><option value="bright">明るい数字 / 暗い背景</option></select>
    </label>
    <label>0確定回数 <output id="confirmOut">3</output><input id="confirm" type="range" min="1" max="10" value="3"></label>
    <label><input id="sound" type="checkbox" checked> 音</label>
    <label><input id="vibrate" type="checkbox" checked> 振動</label>
    <label><input id="flash" type="checkbox" checked> フラッシュ点滅</label>
    <button id="flashTest" disabled>フラッシュをテスト</button>
    <p id="flashStatus" class="note">カメラ開始後にフラッシュ対応状況を確認します。</p>
    <details><summary>OCRに渡している画像</summary><canvas id="debug" width="480" height="140"></canvas></details>
  </section>

  <p class="note">精度優先モードでは、同じ切り出し画像から複数の前処理画像を作ってOCRし、結果同士と直近約1.8秒の履歴を照合してから値を確定します。そのため以前より表示更新は遅くなります。</p>
</main>
<script src="app-v7.js?v=1"></script>
</body>
</html>
