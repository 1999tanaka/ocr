<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>7セグ 000 Watcher</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<main class="app">
  <h1>7セグ 000 Watcher</h1>
  <p class="sub">3桁を1桁ずつ指定して認識し、000で通知します。</p>

  <section class="panel">
    <div id="stage" class="stage">
      <video id="video" autoplay playsinline muted></video>
      <div class="roi digit-roi r1" data-digit="1" style="left:47%;top:54%;width:7.2%;height:19%"><span>1桁目</span><i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i></div>
      <div class="roi digit-roi r2" data-digit="2" style="left:54.5%;top:54%;width:7.2%;height:19%"><span>2桁目</span><i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i></div>
      <div class="roi digit-roi r3" data-digit="3" style="left:62%;top:54%;width:7.2%;height:19%"><span>3桁目</span><i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i></div>
    </div>
    <p class="note">各枠を数字1文字だけに合わせてください。枠全体のドラッグで移動、四隅でサイズ変更できます。</p>
    <div class="buttons">
      <button id="start" class="primary">カメラ開始</button>
      <button id="stop" disabled>停止</button>
      <button id="notify">通知を許可</button>
    </div>
  </section>

  <section class="panel result">
    <div><small>認識値</small><strong id="value">---</strong></div>
    <div><small>状態</small><b id="status">停止中</b></div>
  </section>

  <section class="panel settings">
    <h2>調整</h2>
    <label>判定感度 <output id="thresholdOut">125</output><input id="threshold" type="range" min="20" max="235" value="125"></label>
    <label>表示タイプ
      <select id="polarity"><option value="auto" selected>自動</option><option value="dark">暗い数字 / 明るい背景</option><option value="bright">明るい数字 / 暗い背景</option></select>
    </label>
    <label>000確定回数 <output id="confirmOut">3</output><input id="confirm" type="range" min="1" max="10" value="3"></label>
    <label><input id="sound" type="checkbox" checked> 音</label>
    <label><input id="vibrate" type="checkbox" checked> 振動</label>
    <details><summary>各桁の認識状態</summary><canvas id="debug" width="480" height="160"></canvas></details>
  </section>

  <p class="note">高信頼度の値は即時反映し、曖昧なときだけ直近約0.3秒の結果で補正します。</p>
</main>
<script src="app-v4.js?v=1"></script>
</body>
</html>
